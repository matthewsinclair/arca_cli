name: Test

on:
  push:
    branches: [ main, develop ]
    # A push that only moves a board starts no run (devbin#0110). Path filters
    # are not evaluated for pushes of tags, so this cannot suppress a release.
    paths-ignore:
      - 'intent/whiteboard/**'
  pull_request:
    branches: [ main, develop ]

env:
  MIX_ENV: test
  TERM: xterm
  ARCA_CLI_CONFIG_PATH: .arca_cli
  ARCA_CLI_CONFIG_FILE: config.json

# SUPERSEDED RUNS ARE CANCELLED ON EVERY EVENT (hv's ruling of 2026-09-21;
# devbin#0108 carries the reasoning).
# This block used to cancel PULL REQUEST runs only: the group was keyed on the
# ref while cancel-in-progress was an expression true only for pull_request, so
# two pushes to main queued rather than superseding each other. It read as
# compliant and was not.
# The EVENT is part of the key because a push and an on-demand run share a ref,
# and a group keyed on the ref alone lets each cancel the other. GitHub already
# replaces a PENDING run in a group; cancel-in-progress adds the RUNNING one.
#
# No tag trigger is added here, deliberately: that trigger exists to carry a
# macOS leg onto a release, and this repository has no macOS job. Adding one
# would start runs the ruling never asked for.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - uses: actions/checkout@v7
    
    # `.tool-versions` is the ONE home for the toolchain pin -- no fallback
    # default here, because a hardcoded second copy silently diverges from it
    # and `--warnings-as-errors` is the only type gate this project has. Absent
    # pin file = hard stop.
    #
    # This replaces a hardcoded `elixir-version: '1.18'` / `otp-version: '27'`,
    # two majors behind what every local run used, drifted there unnoticed.
    - name: Determine Elixir version
      id: elixir_version
      run: |
        if [ ! -f .tool-versions ]; then
          echo "::error::.tool-versions is missing -- it is the only source of the toolchain pin." >&2
          exit 1
        fi
        echo "version=$(grep -h '^elixir ' .tool-versions | awk '{ print $2 }' | awk -F - '{print $1}')" >> $GITHUB_OUTPUT

    - name: Determine OTP version
      id: otp_version
      run: |
        if [ ! -f .tool-versions ]; then
          echo "::error::.tool-versions is missing -- it is the only source of the toolchain pin." >&2
          exit 1
        fi
        echo "version=$(grep -h '^erlang ' .tool-versions | awk '{ print $2 }')" >> $GITHUB_OUTPUT

    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      with:
        elixir-version: ${{ steps.elixir_version.outputs.version }}
        otp-version: ${{ steps.otp_version.outputs.version }}
    
    - name: Restore dependencies cache
      uses: actions/cache@v6
      with:
        path: deps
        key: ${{ runner.os }}-mix-deps-${{ hashFiles('**/mix.lock') }}
        restore-keys: |
          ${{ runner.os }}-mix-deps-
    
    - name: Restore build cache
      uses: actions/cache@v6
      with:
        path: _build
        key: ${{ runner.os }}-mix-build-${{ hashFiles('**/mix.lock') }}
        restore-keys: |
          ${{ runner.os }}-mix-build-
    
    - name: Install dependencies
      run: |
        mix local.hex --force
        mix local.rebar --force
        mix deps.get
    
    - name: Check for unused dependencies
      run: mix deps.unlock --check-unused
    
    - name: Compile with warnings as errors
      run: mix compile --warnings-as-errors --force
    
    - name: Check formatting
      run: mix format --check-formatted
    
    - name: Run tests
      run: mix test